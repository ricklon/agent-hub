server:
  host: "0.0.0.0"
  ws_port: 8000
  http_port: 8003
  dashboard_port: 8001
  # Port for the page-agent MCP bridge (SSE-down / POST-up JSON-RPC).
  # Defaults to the dashboard port so the browser page connects same-origin.
  # Set to a dedicated value (e.g. 8004) to isolate it as its own port.
  mcp_bridge_port: 8001
  # Optional HTTP Basic auth for /dashboard/*.
  # Leave password empty for local/LAN-only development.
  dashboard_username: "admin"
  dashboard_password: ""
  # Optional Cloudflare Access identity. Configure both values to verify the
  # signed Access JWT and show the authenticated operator in the dashboard.
  dashboard_access_team_domain: ""  # e.g. example.cloudflareaccess.com
  dashboard_access_audience: ""     # Access application AUD tag
  # Required with Access identity. These verified emails are promoted to
  # administrator; every other new identity starts as a read-only viewer.
  dashboard_admin_emails: ""         # comma-separated
  # Optional shared secret required during device check-in.
  # Leave empty for trusted LAN/classroom auto-registration.
  enrollment_token: ""
  # Devices should heartbeat at this cadence. The dashboard marks a device
  # offline when no heartbeat or live voice session is seen before the timeout.
  heartbeat_interval_seconds: 60
  heartbeat_timeout_seconds: 180
  # Directory the dashboard may read captured device images from.
  dashboard_image_root: "data/images"
  # Extra origins allowed to submit dashboard forms, comma-separated.
  # Only needed when a reverse proxy rewrites the Host header; the request's
  # own Host is always allowed. Cross-origin POSTs are rejected otherwise.
  dashboard_allowed_origins: ""
  # Host header allowlist for the dashboard, comma-separated. When set, the
  # dashboard rejects any request whose Host is not listed, which is what stops
  # DNS-rebinding attacks from a browser on your LAN. List every name and IP
  # the dashboard is reached by. Enforced on the dashboard port only — devices
  # connect by bare IP and would be rejected on theirs.
  allowed_hosts: ""
  # Reverse proxies in front of the device endpoints, comma-separated IPs or
  # CIDRs. When a check-in's socket peer matches, the client IP is read from
  # X-Forwarded-For instead of the (proxy) peer address, so the dashboard shows
  # each device's real address. Leave empty on LAN-first deployments with no
  # proxy — the header is then ignored and cannot be spoofed. For the Caddy
  # overlay, the compose network range, e.g. "172.16.0.0/12".
  trusted_proxies: ""
  # Override the WebSocket URL sent to devices on check-in.
  # Leave empty to auto-detect from the server's LAN IP.
  websocket: ""
  # Preferred: IANA timezone name so daylight saving time is handled.
  # Leave empty to use timezone_offset below.
  timezone: "America/New_York"
  # Fallback hours from UTC (e.g. -8 for PST, 8 for CST/Beijing)
  timezone_offset: -8
  # Shared secret for the image explain endpoint (sent to devices on check-in).
  # Leave empty to disable auth (fine for LAN-only deployments).
  image_token: ""
  # Directory to capture ASR input audio into, for diagnosing field accuracy
  # (issue #43): each turn writes the exact WAV handed to the provider plus what
  # it returned, replayable with `just compare-asr`. It records everything said
  # to a device — a privacy decision, not a debug flag. Empty disables it.
  debug_audio_dir: ""

llm:
  default_provider: openai
  # Vision model used by the image explain endpoint (POST /xiaozhi/v1/image/).
  # Must support vision/image_url inputs. Defaults to google/gemma-3-27b-it on OpenRouter.
  vision_model: "google/gemma-3-27b-it"
  # Free mode. When true the Models page lists only free OpenRouter models
  # (prompt price $0, ids usually end in ":free") and the dashboard refuses to
  # select or save a paid model id. Use it for class nights and public demos
  # where nobody should be able to run up a bill from the UI. It does not
  # change models already saved on personas.
  free_only: false
  openai:
    api_key: "YOUR_OPENAI_API_KEY"
    model: "gpt-4o-mini"
    base_url: null  # set to Ollama/LM Studio URL for local inference
  anthropic:
    api_key: "YOUR_ANTHROPIC_API_KEY"
    model: "claude-haiku-4-5-20251001"
  # LLM spend metering. Every call is recorded; these caps decide when to warn
  # and when to stop. A hub reachable from the internet with a working API key
  # can otherwise run up an unbounded bill.
  #
  # This is a local backstop that only counts what it sees — keep a hard spend
  # cap at the provider as the real limit.
  spend:
    # 0 disables that cap. Both are checked independently.
    daily_limit_usd: 0
    total_limit_usd: 0
    # Warn from this fraction of a cap (0.8 = warn from 80%).
    warn_at: 0.8
    # What the device says when a cap blocks a turn. Defaults to a generic
    # "I've reached my spending limit" line.
    limit_message: ""
    # Fallback prices in USD per 1M tokens, used only when the endpoint does
    # not report a cost. OpenRouter reports real costs, so this is for
    # OpenAI-compatible endpoints that don't.
    pricing: {}
    #  "google/gemma-3-27b-it":
    #    input: 0.10
    #    output: 0.20

tts:
  default_provider: edge
  edge:
    voice: "en-US-AriaNeural"
    rate: "+0%"
    volume: "+0%"
  kitten:
    # Available: kitten-tts-mini-0.8 (80M), kitten-tts-micro-0.8 (40M),
    #            kitten-tts-nano-0.8 (15M), kitten-tts-nano-0.8-int8 (15M/25MB)
    model: "KittenML/kitten-tts-nano-0.8"
    # Available voices: Bella, Jasper, Luna, Bruno, Rosie, Hugo, Kiki, Leo
    voice: "Luna"
    speed: 1.0

asr:
  default_provider: funasr_onnx
  funasr_onnx:
    model_dir: "models/SenseVoiceSmall-onnx"
    language: "en"  # auto | en | zh | ja | ko | yue
    intra_op_num_threads: 4
    quantize: true
  funasr:
    model_dir: "models/SenseVoiceSmall"
    language: "en"  # auto | en | zh | ja | ko | yue
  openai_whisper:
    api_key: null  # inherits llm.openai.api_key when omitted
    model: "whisper-1"
    language: "en"
  moonshine:
    # Lightweight on-device ASR — 34M params (tiny), ~70MB, no API keys needed.
    # Supports: en, es, zh, ja, ko, vi, uk, ar
    # Model arch: tiny (34M), tiny_streaming, base, base_streaming,
    #             small_streaming (123M), medium_streaming (245M)
    language: "en"
    model_arch: "tiny"
    cache_root: "models/moonshine"

vad:
  silero:
    model_path: "models/silero_vad.onnx"
    threshold: 0.5
    threshold_low: 0.2
    min_silence_duration_ms: 1000

registry:
  db_path: "data/registry.db"
  # Stale-agent cleanup. The dashboard home shows agents past these thresholds
  # and offers to remove them; page agents (one row per browser tab) past
  # stale_page_hours are also removed automatically once an hour. Devices are
  # never removed without a person clicking.
  stale_device_days: 14
  stale_page_hours: 24

hub:
  default_persona:
    name: "hub-default"
    llm_provider: openai
    tts_provider: edge
    asr_provider: funasr_onnx
    system_prompt: |
      You are a helpful voice assistant.
      Keep responses concise and conversational — two sentences or fewer.
